plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-26"
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

sourceSets.main.java.srcDirs = ['src/main/java', 'src/universal/java']

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version

    filesMatching('*.json') {
        def legacy = project.minecraft_version.startsWith('1.21')
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'minecraft_dependency': legacy ? '>=1.21 <1.22' : '>=26.1 <26.4',
                'mixins': legacy ? '["LegacyElementMixin", "ModernElementMixin"]' : '["ElementMixin"]',
                'java_compatibility': legacy ? '21' : '25'
    }
}
