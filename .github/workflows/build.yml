name: Build Minecraft versions

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.11
            yarn: 1.21.11+build.6
            build_file: build-legacy.gradle
            java: '21'
            artifact: 1.21
          - minecraft: 26.3
            yarn: ''
            build_file: ''
            java: '25'
            artifact: 26.1

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Select build configuration
        if: matrix.build_file != ''
        run: cp "$BUILD_FILE" build.gradle
        env:
          BUILD_FILE: ${{ matrix.build_file }}
      - name: Build
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          YARN_VERSION: ${{ matrix.yarn }}
        run: |
          if [ -n "$YARN_VERSION" ]; then
            gradle build -Pminecraft_version="$MINECRAFT_VERSION" -Pyarn_mappings="$YARN_VERSION"
          else
            gradle build -Pminecraft_version="$MINECRAFT_VERSION"
          fi
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: right-click-close-${{ matrix.artifact || matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
