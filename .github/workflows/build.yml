name: Build Minecraft versions

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21
            yarn: 1.21+build.9
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.1
            yarn: 1.21.1+build.3
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.2
            yarn: 1.21.2+build.1
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.3
            yarn: 1.21.3+build.2
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.4
            yarn: 1.21.4+build.8
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.5
            yarn: 1.21.5+build.1
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.6
            yarn: 1.21.6+build.1
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.7
            yarn: 1.21.7+build.8
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.8
            yarn: 1.21.8+build.1
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.9
            yarn: 1.21.9+build.1
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.10
            yarn: 1.21.10+build.3
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 1.21.11
            yarn: 1.21.11+build.6
            build_file: build-legacy.gradle
            java: '21'
          - minecraft: 26.1
            yarn: ''
            build_file: ''
            java: '25'
          - minecraft: 26.1.1
            yarn: ''
            build_file: ''
            java: '25'
          - minecraft: 26.1.2
            yarn: ''
            build_file: ''
            java: '25'
          - minecraft: 26.2
            yarn: ''
            build_file: ''
            java: '25'
          - minecraft: 26.3
            yarn: ''
            build_file: ''
            java: '25'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Select build configuration
        if: matrix.build_file != ''
        run: cp "$BUILD_FILE" build.gradle
        env:
          BUILD_FILE: ${{ matrix.build_file }}
      - name: Build
        env:
          MINECRAFT_VERSION: ${{ matrix.minecraft }}
          YARN_VERSION: ${{ matrix.yarn }}
        run: |
          if [ -n "$YARN_VERSION" ]; then
            gradle build -Pminecraft_version="$MINECRAFT_VERSION" -Pyarn_mappings="$YARN_VERSION"
          else
            gradle build -Pminecraft_version="$MINECRAFT_VERSION"
          fi
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: right-click-close-${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
